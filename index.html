<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e120d" />

    <!-- Con JavaScript, los bloques pueden esperar ocultos a revelarse; sin él
         (o mientras carga), el HTML prerenderizado se ve completo. -->
    <script>document.documentElement.classList.add('js')</script>

    <!-- El prerender reemplaza el título y pone aquí la descripción, el
         canonical y el Open Graph de cada ruta (src/data/seo.js). -->
    <title>Reserva Las Rastras · Barrio residencial en Talca</title>
    <!--cabeza-->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:site_name" content="Reserva Las Rastras" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Cinzel para los titulares (la capital romana que rima con el logotipo)
         e Inter para el texto y las cifras. Se precarga la conexión para que la
         fuente no bloquee el primer pintado. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
